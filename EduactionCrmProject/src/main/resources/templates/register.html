                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                    id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <!-- Home -->
                        <li class="nav-item">
                            <a class="nav-link active text-white"

                        </li>

                        <!-- Link -->

                                Link
                            </a>
                        </li>

                        <!-- More Dropdown -->
                        <li class="nav-item dropdown">

                                href="#"

                                <li>

                                        online batch details
                                    </a>
                                </li>

                    </ul>


                    <!-- Login & Register -->
                    <button type="button"
                        class="btn btn-primary"
                        style="margin-left: 5px;">

                        <a style="color: white; text-decoration: none;"
                            href="/login">
                            Login
                        </a>

                    </button>


                    <button type="button"
                        class="btn btn-primary"
                        style="margin: 5px;">

                        <a style="color: white; text-decoration: none;"
                            href="/register">
                            Register
                        </a>

                    </button>

                </div>

            </div>

        </nav>

    </header>


    <!-- ================= REGISTER FORM ================= -->

    <main>

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow mt-5 mb-5">

                        <div class="card-body p-4">

                            <h2 class="text-center mb-4">
                                Create Account
                            </h2>

                            <p class="text-center text-muted mb-4">
                                Register with DV Programming
                            </p>


                            <!-- Register Form -->
                            <form action="rform" method="post">
								
								
								<div th:if="${sucess}" class="alert alert-success" role="alert">
								  		<span th:text="${sucess}"></span>
								</div>
								

                                <!-- Name -->
                                <div class="mb-3">

                                    <label for="name"
                                        class="form-label">
                                        Name
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="name"
                                        name="name"
                                        placeholder="Enter your name"
                                        required>

                                </div>


                                <!-- Email -->
                                <div class="mb-3">

                                    <label for="email"
                                        class="form-label">
                                        Email
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your email"
                                        required>

                                </div>


                                <!-- Password -->
                                <div class="mb-3">

                                    <label for="password"
                                        class="form-label">
                                        Password
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Enter your password"
                                        required>

                                </div>


                                <!-- Phone Number -->
                                <div class="mb-3">

                                    <label for="phone"
                                        class="form-label">
                                        Phone Number
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="phone"
                                        name="phone"
                                        placeholder="Enter your phone number"
                                        required>

                                </div>


                                <!-- City -->
                                <div class="mb-3">

                                    <label for="city"
                                        class="form-label">
                                        City
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="city"
                                        name="city"
                                        placeholder="Enter your city"
                                        required>

                                </div>


                                <!-- Register Button -->
                                <div class="d-grid">

                                    <button type="submit"
                                        class="btn btn-primary">
                                        Register
                                    </button>

                                </div>

                            </form>


                            <!-- Login Link -->
                            <p class="text-center mt-3">

                                Already have an account?

                                <a href="/login">
                                    Login
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>
